name: 24/7 LinkedIn Autonomous Growth & Publishing Engine

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  schedule:
    # Runs every 30 minutes, 24/7 in GitHub's free cloud runner
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-editorial-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore LinkedIn OAuth Credentials (from GitHub Secret if configured)
        env:
          LINKEDIN_CREDENTIALS: ${{ secrets.LINKEDIN_CREDENTIALS }}
        run: |
          if [ -n "$LINKEDIN_CREDENTIALS" ]; then
            mkdir -p linkedin
            echo "$LINKEDIN_CREDENTIALS" > linkedin/credentials.json
            chmod 600 linkedin/credentials.json
            echo "LinkedIn credentials successfully configured from secret."
          else
            echo "LINKEDIN_CREDENTIALS secret not set; using local/mock publishing mode."
          fi

      - name: Execute Autonomous Editorial & Publishing Cycle
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python linkedin/tools/daemon.py --once

      - name: Commit & push updated logs, queue state, and analytics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Antigravity Cloud Runner"
          git add linkedin/queue/ linkedin/history/ linkedin/jobs/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto: scheduled EU publishing & telemetry update [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break || sleep 5
            done
          fi
