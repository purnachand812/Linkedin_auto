<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background:#0B0F19; font-family: 'Courier New', Courier, monospace;">
  <rect width="1080" height="1350" fill="#0B0F19"/>
  <text x="80" y="85" fill="#06B6D4" font-size="28" font-weight="bold" letter-spacing="2">TERMINAL AI PAIR PROGRAMMER</text>
  <text x="80" y="125" fill="#F8FAFC" font-size="38" font-weight="bold">Aider Git-Aware State Boundary</text>

  <rect x="80" y="200" width="920" height="950" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
  
  <rect x="140" y="260" width="800" height="180" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="310" fill="#67E8F9" font-size="16" font-weight="bold">STEP 1: TERMINAL CLI REQUEST</text>
  <text x="170" y="350" fill="#F8FAFC" font-size="22" font-weight="bold">Developer Terminal Input + Repo Map</text>
  <text x="170" y="390" fill="#94A3B8" font-size="15">No vector DB needed — Reads git repository map &amp; diffs directly</text>

  <path d="M 540 440 L 540 500" stroke="#06B6D4" stroke-width="3"/>

  <rect x="140" y="500" width="800" height="200" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="170" y="550" fill="#67E8F9" font-size="16" font-weight="bold">STEP 2: LLM MULTI-FILE REFACTORING</text>
  <text x="170" y="590" fill="#F8FAFC" font-size="22" font-weight="bold">Generates Code Edits Across Targeted Files</text>
  <text x="170" y="630" fill="#38BDF8" font-size="15">Connects via OpenRouter / Anthropic / Local Ollama</text>

  <path d="M 540 700 L 540 760" stroke="#06B6D4" stroke-width="3"/>

  <rect x="140" y="760" width="800" height="180" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="810" fill="#67E8F9" font-size="16" font-weight="bold">STEP 3: AUTOMATIC GIT COMMIT SAFETY NET</text>
  <text x="170" y="850" fill="#F8FAFC" font-size="22" font-weight="bold">Auto-Stages Local Git Commit Per Action Step</text>
  <text x="170" y="890" fill="#67E8F9" font-size="15">🔒 Rollback Protection: Instantly undo hallucinations with git reset</text>

  <text x="80" y="1250" fill="#64748B" font-size="14">Purnachandra Madhukar | Research-First Technical Content System</text>
  <text x="760" y="1250" fill="#06B6D4" font-size="14" font-weight="bold">github.com/aider-ai/aider</text>
</svg>
