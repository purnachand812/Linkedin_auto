<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background:#0B0F19; font-family: 'Courier New', Courier, monospace;">
  <!-- Background -->
  <rect width="1080" height="1350" fill="#0B0F19"/>
  
  <!-- Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="0" y1="150" x2="1080" y2="150"/>
    <line x1="0" y1="1200" x2="1080" y2="1200"/>
    <line x1="540" y1="150" x2="540" y2="1200"/>
  </g>

  <!-- Title Header -->
  <text x="80" y="85" fill="#06B6D4" font-size="28" font-weight="bold" letter-spacing="2">SELF-HOSTED AGENT ARCHITECTURE</text>
  <text x="80" y="125" fill="#F8FAFC" font-size="38" font-weight="bold">Cloud SaaS vs OpenClaw Local Gateway</text>

  <!-- PANEL A: CLOUD SAAS AGENT -->
  <rect x="80" y="180" width="440" height="980" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="110" y="210" width="160" height="36" rx="6" fill="#EF4444" opacity="0.2"/>
  <text x="125" y="234" fill="#FCA5A5" font-size="16" font-weight="bold">CLOUD AGENT</text>

  <!-- Node 1 -->
  <rect x="110" y="280" width="380" height="100" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="130" y="320" fill="#94A3B8" font-size="14">TRIGGER CHANNEL</text>
  <text x="130" y="350" fill="#F8FAFC" font-size="20" font-weight="bold">Slack / Discord / Web</text>

  <path d="M 300 380 L 300 440" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Node 2 -->
  <rect x="110" y="440" width="380" height="140" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="130" y="480" fill="#FCA5A5" font-size="14">CLOUD SAAS CONTROL PLANE</text>
  <text x="130" y="510" fill="#F8FAFC" font-size="18" font-weight="bold">Third-Party Cloud API</text>
  <text x="130" y="540" fill="#94A3B8" font-size="14">⚠️ Full Slack &amp; File Access Token</text>

  <path d="M 300 580 L 300 640" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Node 3 -->
  <rect x="110" y="640" width="380" height="120" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="130" y="680" fill="#94A3B8" font-size="14">MODEL INFERENCE</text>
  <text x="130" y="710" fill="#F8FAFC" font-size="18" font-weight="bold">Commercial API Token Bill</text>

  <!-- Tradeoffs Panel A -->
  <rect x="110" y="800" width="380" height="320" rx="8" fill="#020617" stroke="#334155" stroke-width="1"/>
  <text x="130" y="840" fill="#FCA5A5" font-size="16" font-weight="bold">OPERATIONAL TRADEOFFS</text>
  <text x="130" y="880" fill="#94A3B8" font-size="15">• $20/mo per user subscription</text>
  <text x="130" y="920" fill="#94A3B8" font-size="15">• Slack messages read by cloud</text>
  <text x="130" y="960" fill="#94A3B8" font-size="15">• Zero local setup friction</text>
  <text x="130" y="1000" fill="#94A3B8" font-size="15">• Continuous API billing loops</text>


  <!-- PANEL B: OPENCLAW LOCAL GATEWAY -->
  <rect x="560" y="180" width="440" height="980" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
  <rect x="590" y="210" width="180" height="36" rx="6" fill="#06B6D4" opacity="0.2"/>
  <text x="605" y="234" fill="#67E8F9" font-size="16" font-weight="bold">OPENCLAW (MIT)</text>

  <!-- Node 1 -->
  <rect x="590" y="280" width="380" height="100" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="610" y="320" fill="#94A3B8" font-size="14">TRIGGER CHANNEL</text>
  <text x="610" y="350" fill="#F8FAFC" font-size="20" font-weight="bold">Slack / Discord / Telegram</text>

  <path d="M 780 380 L 780 440" stroke="#06B6D4" stroke-width="2.5"/>

  <!-- Node 2 -->
  <rect x="590" y="440" width="380" height="140" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="610" y="480" fill="#67E8F9" font-size="14">LOCAL GATEWAY CONTROL PLANE</text>
  <text x="610" y="510" fill="#F8FAFC" font-size="18" font-weight="bold">Python Local Process / Docker</text>
  <text x="610" y="540" fill="#38BDF8" font-size="14">🔒 100% Local Hardware Boundary</text>

  <path d="M 780 580 L 780 640" stroke="#06B6D4" stroke-width="2.5"/>

  <!-- Node 3 -->
  <rect x="590" y="640" width="380" height="120" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="610" y="680" fill="#94A3B8" font-size="14">MODEL INFERENCE</text>
  <text x="610" y="710" fill="#F8FAFC" font-size="18" font-weight="bold">Ollama / vLLM / Local GPU</text>

  <!-- Tradeoffs Panel B -->
  <rect x="590" y="800" width="380" height="320" rx="8" fill="#020617" stroke="#06B6D4" stroke-width="1"/>
  <text x="610" y="840" fill="#67E8F9" font-size="16" font-weight="bold">OPERATIONAL TRADEOFFS</text>
  <text x="610" y="880" fill="#94A3B8" font-size="15">• $0 code license (MIT)</text>
  <text x="610" y="920" fill="#94A3B8" font-size="15">• Complete data privacy</text>
  <text x="610" y="960" fill="#94A3B8" font-size="15">• 30W-60W idle hardware power</text>
  <text x="610" y="1000" fill="#94A3B8" font-size="15">• Requires local Docker setup</text>

  <!-- Footer -->
  <text x="80" y="1250" fill="#64748B" font-size="14">Purnachandra Madhukar | Research-First Technical Content System</text>
  <text x="780" y="1250" fill="#06B6D4" font-size="14" font-weight="bold">github.com/openclaw/openclaw</text>
</svg>
