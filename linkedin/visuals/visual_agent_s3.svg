<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background:#0B0F19; font-family: 'Courier New', Courier, monospace;">
  <rect width="1080" height="1350" fill="#0B0F19"/>
  <text x="80" y="85" fill="#06B6D4" font-size="28" font-weight="bold" letter-spacing="2">COMPUTER-USE AGENT EXECUTION</text>
  <text x="80" y="125" fill="#F8FAFC" font-size="38" font-weight="bold">Agent S3 Pixel-Based GUI Control</text>

  <rect x="80" y="200" width="920" height="950" rx="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
  
  <rect x="140" y="260" width="800" height="180" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="310" fill="#67E8F9" font-size="16" font-weight="bold">STEP 1: DESKTOP SCREEN SNAPSHOT</text>
  <text x="170" y="350" fill="#F8FAFC" font-size="22" font-weight="bold">Captures 4K GUI Screen Pixels (macOS / Win / Linux)</text>
  <text x="170" y="390" fill="#94A3B8" font-size="15">No API requirement — Reads legacy enterprise software UI directly</text>

  <path d="M 540 440 L 540 500" stroke="#06B6D4" stroke-width="3"/>

  <rect x="140" y="500" width="800" height="200" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
  <text x="170" y="550" fill="#67E8F9" font-size="16" font-weight="bold">STEP 2: MULTIMODAL VISION LLM REASONING</text>
  <text x="170" y="590" fill="#F8FAFC" font-size="22" font-weight="bold">Calculates Click Coordinates &amp; Action Intent</text>
  <text x="170" y="630" fill="#FCA5A5" font-size="15">⚠️ Latency Catch: 3–5 seconds per 4K screen frame</text>

  <path d="M 540 700 L 540 760" stroke="#06B6D4" stroke-width="3"/>

  <rect x="140" y="760" width="800" height="180" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="810" fill="#67E8F9" font-size="16" font-weight="bold">STEP 3: OS MOUSE &amp; KEYBOARD EXECUTION</text>
  <text x="170" y="850" fill="#F8FAFC" font-size="22" font-weight="bold">Issues Physical Click / Scroll / Keypress Actions</text>
  <text x="170" y="890" fill="#38BDF8" font-size="15">🔒 Security Requirement: Isolated VM / Container Sandboxing</text>

  <text x="80" y="1250" fill="#64748B" font-size="14">Purnachandra Madhukar | Research-First Technical Content System</text>
  <text x="740" y="1250" fill="#06B6D4" font-size="14" font-weight="bold">github.com/simular-ai/agent-s3</text>
</svg>
